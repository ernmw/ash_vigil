# yaml-language-server: $schema=../../../../../Backstage/replacerSchema.json
log_name: Hlervu Tomb

instances:
  # calm down all the undead
  - conditions:
      - cell:
        - "hlervu ancestral tomb"
      - is_dead: false
      - creature_type: undead
      - is_follower: false
      - has_journal:
          quest: av_mm_hlervu
          min: 10
      - not: {record_id: Lich}
      - not: {record_id: lich}
      - not: {record_id: summon}
      - not: {record_id: "^AV_"}
      - not: {record_id: "^av_"}
      - not: {has_lua_script: scripts/AshVigil/ecs/peaceful.lua}
      - global_value:
        - AV_cinia_hostile:
            max: 0
    actions:
      - add_lua_script: scripts/AshVigil/ecs/peaceful.lua
  # place Cinia
  - conditions:
      - cell:
        - "hlervu ancestral tomb"
      - has_journal:
          quest: av_mm_hlervu
          min: 10
    once: true
    trigger: cell_enter
    actions:
      - create:
          AV_Cinia:
            transform_type: absolute
            position:
              x:  1891.69
              y: -37.6529
              z: -1023.23
  # put Cinia in the same "faction" as the undead
  - conditions:
      - cell:
        - "hlervu ancestral tomb"
      - has_journal:
          quest: av_mm_hlervu
          min: 10
      - record_id: "AV_Cinia"
      - global_value:
        - AV_cinia_hostile:
            max: 0
      - not: {has_lua_script: scripts/AshVigil/ecs/peaceful.lua}
    actions:
      - add_lua_script: scripts/AshVigil/ecs/peaceful.lua
